version: "3.9"

services:
  photogram:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - photogram_jobs:/tmp/photogram_jobs
    environment:
      - WORK_DIR=/tmp/photogram_jobs
      - FRAME_FPS=1
      - JOB_TTL_SECS=3600
      - MAX_UPLOAD_MB=4096
    restart: unless-stopped

    # Uncomment to enable GPU acceleration (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  photogram_jobs:
