<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photogram — 3D Room Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0c12;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
    }

    #ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      pointer-events: none;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(10, 12, 18, 0.8);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      pointer-events: all;
    }

    .topbar a {
      color: #60a5fa;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .topbar a:hover { color: #93c5fd; }

    .topbar h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f1f5f9;
    }

    #controls-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 12, 18, 0.75);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 0.8rem;
      color: #94a3b8;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 1s;
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      background: #0a0c12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
    }

    #loading-overlay p { color: #94a3b8; font-size: 0.9rem; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #1e293b;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui-overlay">
    <div class="topbar">
      <a href="/">&larr; New scan</a>
      <h2>3D Room Viewer</h2>
      <a id="download-link" href="#">Download OBJ</a>
    </div>
  </div>

  <div id="controls-hint">
    Left-drag to orbit &nbsp;&bull;&nbsp; Right-drag / middle-drag to pan &nbsp;&bull;&nbsp; Scroll to zoom
  </div>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <p id="loading-text">Loading 3D model...</p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="/static/viewer.js"></script>
</body>
</html>
